[toolchain]
anchor_version = "0.30.1"

[features]
resolution = true
skip-lint = false

[programs.localnet]
acp = "ACPv4Wa11etRep11111111111111111111111111111"

[programs.devnet]
acp = "ACPv4Wa11etRep11111111111111111111111111111"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/id.json"

[scripts]
# IDL autogeneration is disabled (see README). The IDL is emitted by a script
# that computes Anchor's own discriminators, and staged into target/ here
# because target/ is gitignored.
test = "node scripts/build-idl.mjs && mkdir -p target/idl target/types && cp idl/acp.json target/idl/acp.json && ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"
