[package]
name = "acp"
version = "0.4.0"
description = "Agentic Commerce Protocol — escrow, settlement, wallet reputation"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "acp"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = "0.30.1"
